version: '3.8'

services:
  # Main API service
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: cardioscreen-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ../../models:/app/models
      - ../../reports:/app/reports
      - ../../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Training service (run once to train model)
  trainer:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: cardioscreen-trainer
    command: python -m cardioscreen train
    volumes:
      - ../../models:/app/models
      - ../../reports:/app/reports
      - ../../data:/app/data
    profiles:
      - training

  # Development service with hot reload
  dev:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.dev
    container_name: cardioscreen-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ../../cardioscreen:/app/cardioscreen
      - ../../static:/app/static
      - ../../data:/app/data
      - ../../models:/app/models
      - ../../reports:/app/reports
    command: python -m cardioscreen serve --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev