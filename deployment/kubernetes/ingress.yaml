apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardioscreen-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cardioscreen.example.com
      secretName: cardioscreen-tls
  rules:
    - host: cardioscreen.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cardioscreen-api
                port:
                  number: 80