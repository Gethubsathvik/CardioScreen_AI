[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardioscreen-ai"
version = "2.0.0"
description = "Heart disease risk screening with ML model comparison and explanation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "CardioScreen AI Team", email = "team@cardioscreen.ai"}
]
keywords = ["machine-learning", "heart-disease", "medical-ai", "fastapi", "clinical-decision-support"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.6",
    "watchfiles>=0.22",
]
docker = [
    "gunicorn>=22.0",
]

[project.urls]
Homepage = "https://github.com/Gethubsathvik/CardioScreen_AI"
Repository = "https://github.com/Gethubsathvik/CardioScreen_AI"
Issues = "https://github.com/Gethubsathvik/CardioScreen_AI/issues"
Documentation = "https://github.com/Gethubsathvik/CardioScreen_AI/tree/main/docs"

[project.scripts]
cardioscreen = "cardioscreen.__main__:main"
cardioscreen-train = "cardioscreen.train:train"
cardioscreen-serve = "cardioscreen.api:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cardioscreen*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]
per-file-ignores = {
    "tests/*": ["S101", "T201"],  # allow assert and print in tests
    "cardioscreen/legacy/*": ["*"],
}
exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "deployment",
    "legacy",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | venv
  | \.git
  | __pycache__
  | build
  | dist
  | deployment
  | legacy
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
exclude = [
    "deployment",
    "legacy",
    ".venv",
    "venv",
]
[[tool.mypy.overrides]]
module = "cardioscreen.legacy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["cardioscreen"]
omit = [
    "cardioscreen/__main__.py",
    "cardioscreen/legacy/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
repos = [
    {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.5.0", hooks = [
        {id = "ruff", args = ["--fix", "--exit-non-zero-on-fix"]},
        {id = "ruff-format"},
    ]},
    {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.6.0", hooks = [
        {id = "trailing-whitespace"},
        {id = "end-of-file-fixer"},
        {id = "check-yaml"},
        {id = "check-added-large-files"},
    ]},
]