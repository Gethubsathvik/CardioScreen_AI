<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardioScreen AI - Heart Disease Risk Predictor</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <header>
      <div class="mark">❤️</div>
      <div>
        <h1>Heart Disease Risk Predictor</h1>
        <p class="sub" id="model">Loading model…</p>
      </div>
    </header>
    <div class="grid">
      <div class="card">
        <form id="f"></form>
      </div>
      <div class="card" id="out">
        <p class="small">🩺 Fill the form and press <b>Predict</b>. Results appear here.</p>
      </div>
    </div>
    <p class="result-note">📌 Educational research project. Not a medical device and not a substitute for professional
      medical advice.</p>
  </main>
  <script src="app.js"></script>
</body>

</html>
